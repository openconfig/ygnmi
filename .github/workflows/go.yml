name: Go

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

jobs:
  go:
    uses: openconfig/common-ci/.github/workflows/basic_go.yml@abb79c974d34c0ec6cda3bcfcb2edb6679d197e1
    with:
      static-analysis-excludes-regex: exampleoc
      skip-gofmt: true
      skip-staticcheck: true
    permissions:
      contents: read
      packages: read
      # To report Github Actions status checks
      statuses: write

  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: 'stable'

    - name: Generate and Check Diff
      # Ignore whitespace because goimports seems to modifying the generated commands inconsistently.
      # Normalise ySchema byte slices because gzip output can vary across Go versions and runs.
      run: |
        go generate ./...
        mkdir -p .git/info
        echo '*.go diff=yschema' >> .git/info/attributes
        git config diff.yschema.textconv "sed -Ez 's|(\tySchema = \[\]byte\{)(\n\t\t0x[0-9a-fA-F][^\n]*)+(\n\t\})|\1\n\t\t// REDACTED_SCHEMA_BYTES\3|g'"
        git diff --exit-code --ignore-all-space --ignore-blank-lines
